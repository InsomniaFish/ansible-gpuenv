---
#===============================================================================
# GPUENV_CHECK role 默认变量
#===============================================================================

# 项目基准目录（与 GPUENV role 保持一致）
gpuenv_base_dir: "/root/ansible-gpuenv"

# gpu-burn 安装目录（统一在 /opt 下）
gpuenv_gpu_burn_dir: "/opt/gpu-burn"

# nccl-tests 安装目录（统一在 /opt 下）
gpuenv_nccl_tests_dir: "/opt/nccl-tests"

# CUDA 环境变量文件（系统固定位置）
gpuenv_cuda_profile: "/etc/profile.d/cuda.sh"

# OpenMPI 安装目录（源码编译安装位置）
gpuenv_openmpi_dir: "/usr/local/openmpi"
