---
# 步骤 7：编译 gpu-burn（GPU 压力测试工具）
# 启用方式：-e gpuenv_install_gpu_burn=true
# 安装模式（gpuenv_gpu_burn_install_mode）：
#   - online（默认）：在线下载 GitHub 源码并编译
#   - package：使用本地源码包（-e gpuenv_gpu_burn_package=<gpu-burn zip 包路径>）

- name: 检查 gpu_burn 是否已编译
  stat:
    path: "{{ gpuenv_gpu_burn_dir }}/gpu_burn"
  register: gpu_burn_bin

- name: gpu_burn 已编译，跳过
  debug:
    msg: "gpu_burn 已编译 ({{ gpuenv_gpu_burn_dir }}/gpu_burn)，跳过"
  when: >
    not gpuenv_force
    and gpu_burn_bin.stat.exists

- name: 确保项目基准目录存在
  file:
    path: "{{ gpuenv_base_dir }}"
    state: directory
    mode: '0755'
  when: gpuenv_force or not gpu_burn_bin.stat.exists

#=============================== online 在线模式 ================================
- name: 下载 gpu-burn 源码（online 模式）
  get_url:
    url: "{{ gpuenv_gpu_burn_url }}"
    dest: "{{ gpuenv_pkg_dir }}/gpu-burn-src.zip"
    mode: '0644'
  when:
    - gpuenv_gpu_burn_install_mode == 'online'
    - gpuenv_force or not gpu_burn_bin.stat.exists

#=============================== package 离线模式 ================================
- name: package 模式校验源码包参数
  fail:
    msg: >-
      gpuenv_gpu_burn_install_mode=package 但未提供源码包，请通过
      -e gpuenv_gpu_burn_package=<gpu-burn zip 包本地路径> 指定
  when:
    - gpuenv_gpu_burn_install_mode == 'package'
    - gpuenv_gpu_burn_package | length == 0

- name: 拷贝本地 gpu-burn 源码包到安装包目录（package 模式）
  copy:
    src: "{{ gpuenv_gpu_burn_package }}"
    dest: "{{ gpuenv_pkg_dir }}/gpu-burn-src.zip"
    mode: '0644'
  when:
    - gpuenv_gpu_burn_install_mode == 'package'
    - gpuenv_force or not gpu_burn_bin.stat.exists

#=============================== 公共：解压编译 ===================================
- name: 清理旧源码目录
  file:
    path: "{{ gpuenv_gpu_burn_dir }}"
    state: absent
  when: gpuenv_force or not gpu_burn_bin.stat.exists

# 解压到临时目录后移动到目标目录（与 zip 内顶层目录名解耦，目标目录统一为 /opt/gpu-burn）
- name: 解压 gpu-burn 源码到目标目录
  shell: |
    rm -rf /tmp/gpu-burn-extract
    unzip -o {{ gpuenv_pkg_dir }}/gpu-burn-src.zip -d /tmp/gpu-burn-extract >/dev/null
    mkdir -p {{ gpuenv_gpu_burn_dir | dirname }}
    mv /tmp/gpu-burn-extract/* {{ gpuenv_gpu_burn_dir }}
    rm -rf /tmp/gpu-burn-extract
  args:
    creates: "{{ gpuenv_gpu_burn_dir }}"
  when: gpuenv_force or not gpu_burn_bin.stat.exists

- name: 编译 gpu-burn
  command: make
  args:
    chdir: "{{ gpuenv_gpu_burn_dir }}"
  register: gpu_burn_make
  when: gpuenv_force or not gpu_burn_bin.stat.exists

# 注意：编译完成后保留 {{ gpuenv_pkg_dir }}/gpu-burn-src.zip 源码包，不做删除

- name: 验证 gpu_burn 可执行文件
  stat:
    path: "{{ gpuenv_gpu_burn_dir }}/gpu_burn"
  register: gpu_burn_final

- name: gpu_burn 编译失败时报错
  fail:
    msg: "gpu_burn 编译失败，请检查编译日志"
  when: not gpu_burn_final.stat.exists

- name: gpu_burn 编译成功
  debug:
    msg: "gpu_burn 编译成功: {{ gpuenv_gpu_burn_dir }}/gpu_burn"
