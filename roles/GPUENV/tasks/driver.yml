---
# 步骤 4：安装 NVIDIA 显卡驱动（对应手册：在线安装 550 系列驱动）
# 精确指定版本时锁定全部驱动子包，避免依赖冲突

- name: 检查驱动是否已安装（仅完全安装状态 ii 视为已安装）
  shell: |
    status=$(dpkg-query -W -f='${db:Status-Abbrev}' nvidia-driver-{{ gpuenv_driver_major }} 2>/dev/null | cut -c1-2)
    [ "$status" = "ii" ] && dpkg-query -W -f='${Version}' nvidia-driver-{{ gpuenv_driver_major }}
  register: driver_installed
  changed_when: false
  failed_when: false

- name: 设置已安装驱动版本事实
  set_fact:
    gpuenv_driver_installed_ver: "{{ driver_installed.stdout | trim }}"

- name: 查找源中与目标版本匹配的驱动包版本
  shell: >
    apt-cache madison nvidia-driver-{{ gpuenv_driver_major }}
    | awk -F'|' '{gsub(/ /,"",$2); print $2}'
    | grep -F "{{ gpuenv_driver_version }}" | head -n 1
  register: driver_repo_ver
  changed_when: false

- name: 驱动版本不存在时报错
  fail:
    msg: "源中未找到驱动版本 {{ gpuenv_driver_version }}（系列 {{ gpuenv_driver_major }}），请检查 gpuenv_driver_version 变量"
  when: driver_repo_ver.stdout | trim | length == 0

- name: 构建驱动子包安装列表（仅保留源中真实存在的子包，全部锁定同一版本）
  shell: |
    for p in {{ gpuenv_driver_subpackages | join(' ') }}; do
      apt-cache show "${p}-{{ gpuenv_driver_major }}" >/dev/null 2>&1 && echo "${p}-{{ gpuenv_driver_major }}={{ driver_repo_ver.stdout | trim }}"
    done
  register: driver_install_list
  changed_when: false

- name: 安装 NVIDIA 驱动（锁定全部子包版本）
  apt:
    name: "{{ driver_install_list.stdout_lines }}"
    state: present
  when: >
    gpuenv_force
    or gpuenv_driver_installed_ver == ''
    or gpuenv_driver_version not in gpuenv_driver_installed_ver

- name: 驱动已安装且版本一致，跳过
  debug:
    msg: "驱动 nvidia-driver-{{ gpuenv_driver_major }} 已安装 {{ gpuenv_driver_installed_ver }}，与目标版本一致，跳过"
  when: >
    not gpuenv_force
    and gpuenv_driver_installed_ver != ''
    and gpuenv_driver_version in gpuenv_driver_installed_ver

- name: 驱动安装后重启服务器（可选）
  reboot:
    reboot_timeout: 600
  when: gpuenv_reboot_after_driver
