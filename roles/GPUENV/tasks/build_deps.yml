---
# 步骤 2：安装编译依赖包（对应手册：apt 安装编译工具链与内核头文件）

- name: 安装编译依赖（build-essential / linux-headers / unzip / curl）
  apt:
    name:
      - build-essential
      - "linux-headers-{{ ansible_kernel }}"
      - unzip
      - curl
    state: present
    update_cache: yes

- name: 验证 gcc 可用
  command: gcc --version
  register: gcc_check
  changed_when: false

- name: 显示 gcc 版本
  debug:
    msg: "{{ gcc_check.stdout_lines[0] }}"
