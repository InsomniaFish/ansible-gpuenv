---
#===============================================================================
# GPUENV_UNINSTALL role：卸载 GPU 环境组件（支持组件级指定）
#
# 通过 gpuenv_uninstall_components 指定卸载范围：
#   - "core"（默认）：驱动 / CUDA / fabricmanager / gpu-burn
#   - "all"：全部组件
#   - 逗号分隔列表：仅卸载指定组件，如 "nccl,openmpi"
#
# 组件名：
#   核心：driver / cuda / fabricmanager / gpu_burn
#   可选：nccl / openmpi / nccl_tests / dcgm / container_toolkit / ofed / peermem / pci_acs / nvshmem
#
# 用法示例：
#   ansible-playbook -i inventory.ini uninstall.yml                                    # 卸载核心组件
#   ansible-playbook -i inventory.ini uninstall.yml -e gpuenv_uninstall_components=all # 卸载全部
#   ansible-playbook -i inventory.ini uninstall.yml -e gpuenv_uninstall_components=nccl,dcgm
#===============================================================================

- name: 显示卸载计划
  debug:
    msg: "即将在 {{ inventory_hostname }} 卸载组件: {{ gpuenv_uninstall_selected | join(', ') }}"

#=============================== 解除 hold ======================================
# 卸载前必做：被 hold 的包 apt-get 拒绝变更（-y 模式报 Held packages were changed），
# 与 gpuenv role 的锁定范围保持一致（按包名前缀匹配）
- name: 解除 GPU 相关包的 hold 标记（卸载前）
  shell: |
    held=$(apt-mark showhold 2>/dev/null | grep -E '^(nvidia-|libnvidia-|cuda|xserver-xorg-video-nvidia|libnccl|datacenter-gpu-manager|doca-|nvshmem)' || true)
    if [ -n "$held" ]; then
      apt-mark unhold $held
    else
      echo "无 GPU 相关包被 hold，跳过"
    fi
  register: uninstall_unhold
  changed_when: "'Canceled hold' in uninstall_unhold.stdout"
  failed_when: false

#=============================== fabricmanager ==================================
- name: 停止 fabricmanager 服务
  systemd:
    name: nvidia-fabricmanager
    state: stopped
  failed_when: false
  when: "'fabricmanager' in gpuenv_uninstall_selected"

- name: 取消 fabricmanager 开机自启
  systemd:
    name: nvidia-fabricmanager
    enabled: no
  failed_when: false
  when: "'fabricmanager' in gpuenv_uninstall_selected"

- name: 卸载 fabricmanager 包
  shell: |
    pkgs=$(dpkg -l | grep -E "^ii\s+nvidia-fabricmanager" | awk '{print $2}' | tr '\n' ' ')
    [ -n "$pkgs" ] && apt-get remove -y --purge $pkgs || echo "fabricmanager 未安装，跳过"
  register: uninstall_fm
  changed_when: "'Removing' in uninstall_fm.stdout or 'Purging' in uninstall_fm.stdout"
  failed_when: false
  when: "'fabricmanager' in gpuenv_uninstall_selected"

#=============================== driver =========================================
- name: 卸载 NVIDIA 驱动相关包（不含 fabricmanager）
  shell: |
    pkgs=$(dpkg -l | grep -E "^ii\s+(nvidia-|libnvidia-|xserver-xorg-video-nvidia)" | grep -v fabricmanager | awk '{print $2}' | tr '\n' ' ')
    [ -n "$pkgs" ] && apt-get remove -y --purge $pkgs || echo "驱动未安装，跳过"
  register: uninstall_driver
  changed_when: "'Removing' in uninstall_driver.stdout or 'Purging' in uninstall_driver.stdout"
  failed_when: false
  when: "'driver' in gpuenv_uninstall_selected"

#=============================== cuda ===========================================
- name: 卸载 CUDA 相关包
  shell: |
    pkgs=$(dpkg -l | grep -E "^ii\s+cuda" | grep -v dcgm | awk '{print $2}' | tr '\n' ' ')
    [ -n "$pkgs" ] && apt-get remove -y --purge $pkgs || echo "CUDA 未安装，跳过"
  register: uninstall_cuda
  changed_when: "'Removing' in uninstall_cuda.stdout or 'Purging' in uninstall_cuda.stdout"
  failed_when: false
  when: "'cuda' in gpuenv_uninstall_selected"

- name: 删除 CUDA 环境变量配置
  file:
    path: "{{ gpuenv_cuda_profile }}"
    state: absent
  when: "'cuda' in gpuenv_uninstall_selected"

#=============================== gpu_burn =======================================
- name: 删除 gpu-burn 目录
  file:
    path: "{{ gpuenv_gpu_burn_dir }}"
    state: absent
  when: "'gpu_burn' in gpuenv_uninstall_selected"

#=============================== nccl ===========================================
- name: 卸载 NCCL 包
  shell: |
    pkgs=$(dpkg -l | grep -E "^ii\s+libnccl" | awk '{print $2}' | tr '\n' ' ')
    [ -n "$pkgs" ] && apt-get remove -y --purge $pkgs || echo "NCCL 未安装，跳过"
  register: uninstall_nccl
  changed_when: "'Removing' in uninstall_nccl.stdout or 'Purging' in uninstall_nccl.stdout"
  failed_when: false
  when: "'nccl' in gpuenv_uninstall_selected"

#=============================== openmpi ========================================
- name: 删除 OpenMPI 安装目录（源码编译产物）
  file:
    path: "{{ gpuenv_openmpi_dir }}"
    state: absent
  when: "'openmpi' in gpuenv_uninstall_selected"

- name: 删除 OpenMPI 环境变量配置
  file:
    path: /etc/profile.d/openmpi.sh
    state: absent
  when: "'openmpi' in gpuenv_uninstall_selected"

#=============================== nccl_tests =====================================
- name: 删除 nccl-tests 目录
  file:
    path: "{{ gpuenv_nccl_tests_dir }}"
    state: absent
  when: "'nccl_tests' in gpuenv_uninstall_selected"

#=============================== dcgm ===========================================
- name: 停止并禁用 DCGM 服务
  systemd:
    name: nvidia-dcgm
    state: stopped
    enabled: no
  failed_when: false
  when: "'dcgm' in gpuenv_uninstall_selected"

- name: 卸载 DCGM 包
  shell: |
    pkgs=$(dpkg -l | grep -E "^ii\s+(datacenter-gpu-manager|cuda-dcgm)" | awk '{print $2}' | tr '\n' ' ')
    [ -n "$pkgs" ] && apt-get remove -y --purge $pkgs || echo "DCGM 未安装，跳过"
  register: uninstall_dcgm
  changed_when: "'Removing' in uninstall_dcgm.stdout or 'Purging' in uninstall_dcgm.stdout"
  failed_when: false
  when: "'dcgm' in gpuenv_uninstall_selected"

#=============================== container_toolkit ==============================
- name: 卸载 nvidia-container-toolkit
  shell: |
    pkgs=$(dpkg -l | grep -E "^ii\s+nvidia-container-toolkit" | awk '{print $2}' | tr '\n' ' ')
    [ -n "$pkgs" ] && apt-get remove -y --purge $pkgs || echo "container-toolkit 未安装，跳过"
  register: uninstall_ctk
  changed_when: "'Removing' in uninstall_ctk.stdout or 'Purging' in uninstall_ctk.stdout"
  failed_when: false
  when: "'container_toolkit' in gpuenv_uninstall_selected"

#=============================== nvshmem ========================================
# 卸载 nvshmem 包（含引导 local-repo 仓库包）并清理：
#   - 引导仓库目录 /var/nvshmem-local-repo-*
#   - 组件维护的 nvidia 驱动参数 /etc/modprobe.d/nvidia.conf（仅含本组件参数时删除）
- name: 卸载 nvshmem 包与本地仓库
  shell: |
    pkgs=$(dpkg -l | grep -E "^ii\s+nvshmem" | awk '{print $2}' | tr '\n' ' ')
    [ -n "$pkgs" ] && apt-get remove -y --purge $pkgs || echo "nvshmem 未安装，跳过"
    rm -rf /var/nvshmem-local-repo-* 2>/dev/null || true
  register: uninstall_nvshmem
  changed_when: "'Removing' in uninstall_nvshmem.stdout or 'Purging' in uninstall_nvshmem.stdout"
  failed_when: false
  when: "'nvshmem' in gpuenv_uninstall_selected"

- name: 清理 nvshmem 驱动参数（仅含本组件参数时删除 /etc/modprobe.d/nvidia.conf）
  shell: |
    if [ -f /etc/modprobe.d/nvidia.conf ] && grep -q 'NVreg_EnableStreamMemOPs' /etc/modprobe.d/nvidia.conf; then
      rm -f /etc/modprobe.d/nvidia.conf
      update-initramfs -u >/dev/null 2>&1 || true
      echo "nvidia.conf 已删除"
    else
      echo "无 nvshmem 驱动参数配置，跳过"
    fi
  register: uninstall_nvshmem_modprobe
  changed_when: "'已删除' in uninstall_nvshmem_modprobe.stdout"
  failed_when: false
  when: "'nvshmem' in gpuenv_uninstall_selected"

#=============================== ofed ===========================================
# 兼容两种 flavor：
#   mlnx_ofed：优先官方 ofed_uninstall（tgz 安装器自带），缺失时 dpkg 兜底清包
#   doca_ofed：DOCA-Host 与 MLNX_OFED 包结构一致，同样优先 ofed_uninstall，
#              兜底正则额外覆盖 doca- 前缀（doca-ofed 元包 / doca-host 源配置器）
# 注意：重装 OFED/DOCA 无需卸载 GPU 驱动（两套独立内核模块栈）。但 nvidia_peermem
#       引用 ib_core 符号，若仍处于加载状态会 hold 住 RDMA 内核模块导致卸载不净，
#       故先 rmmod（未加载/未装 GPU 驱动时该命令幂等无害）
- name: 卸载 OFED 驱动（mlnx_ofed / doca_ofed，优先使用官方 ofed_uninstall）
  shell: |
    rmmod nvidia_peermem 2>/dev/null || true
    if command -v ofed_uninstall >/dev/null 2>&1; then
      ofed_uninstall --force 2>&1 | tail -n 3
    else
      pkgs=$(dpkg -l | grep -E "^ii\s+(rdma-core|ibverbs-providers|ibverbs-utils|infiniband-diags|perftest|libibverbs-dev|librdmacm-dev|mlnx-|ibacm|opensm|doca-)" | awk '{print $2}' | tr '\n' ' ')
      [ -n "$pkgs" ] && apt-get remove -y --purge $pkgs || echo "OFED/RDMA 未安装，跳过"
    fi
  register: uninstall_ofed
  changed_when: true
  failed_when: false
  when: "'ofed' in gpuenv_uninstall_selected"

- name: 卸载 doca-host 源配置器并清理 DOCA apt 源与 GPG 密钥（仅 doca_ofed flavor）
  shell: |
    if dpkg -l 2>/dev/null | grep -qE "^ii\s+doca-host"; then
      apt-get remove -y --purge doca-host || true
    else
      echo "doca-host 未安装，跳过"
    fi
    rm -f /etc/apt/sources.list.d/*doca*.list /etc/apt/sources.list.d/*doca*.sources \
          /etc/apt/sources.list.d/*mellanox*.list /etc/apt/sources.list.d/*mellanox*.sources \
          /etc/apt/trusted.gpg.d/*mellanox* /etc/apt/trusted.gpg.d/*Mellanox* \
          /usr/share/keyrings/*mellanox* /usr/share/keyrings/*Mellanox* 2>/dev/null || true
    apt-get update -qq >/dev/null 2>&1 || true
    echo "DOCA 源与密钥清理完成"
  register: uninstall_doca_repo
  changed_when: true
  failed_when: false
  when:
    - "'ofed' in gpuenv_uninstall_selected"
    - gpuenv_ofed_flavor | default('mlnx_ofed') == 'doca_ofed'

#=============================== peermem ========================================
- name: 卸载 nvidia_peermem 模块并删除开机自动加载配置
  shell: |
    rmmod nvidia_peermem 2>/dev/null || true
    rm -f /etc/modules-load.d/nvidia-peermem.conf
    echo "peermem 配置已清理"
  register: uninstall_peermem
  changed_when: true
  when: "'peermem' in gpuenv_uninstall_selected"

#=============================== pci_acs ========================================
- name: 停止并禁用 ACS 关闭服务（新版 disable-pcie-acs；旧版 disable-pci-acs 兼容清理）
  shell: |
    systemctl stop disable-pcie-acs.service 2>/dev/null || true
    systemctl disable disable-pcie-acs.service 2>/dev/null || true
    systemctl stop disable-pci-acs.service 2>/dev/null || true
    systemctl disable disable-pci-acs.service 2>/dev/null || true
    systemctl daemon-reload
    echo "ACS 服务已停止并禁用"
  register: uninstall_pci_acs_svc
  changed_when: true
  when: "'pci_acs' in gpuenv_uninstall_selected"

- name: 删除 ACS 关闭服务与脚本
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/disable-pcie-acs.service
    - /usr/local/sbin/disable-pcie-acs.sh
    - /etc/systemd/system/disable-pci-acs.service
    - /usr/local/bin/disable-pci-acs.sh
  when: "'pci_acs' in gpuenv_uninstall_selected"

#=============================== 公共清理 =======================================
- name: 清理孤立依赖
  apt:
    autoremove: yes
    purge: yes
  when: gpuenv_uninstall_autoremove

- name: 刷新 systemd 单元缓存（清除已卸载服务的单元残留）
  systemd:
    daemon_reload: yes

- name: 验证卸载结果
  shell: dpkg -l | grep -E "^ii\s+(nvidia-|libnvidia-|xserver-xorg-video-nvidia|cuda|libnccl|datacenter-gpu-manager|doca-)" | awk '{print $2}' || true
  register: uninstall_verify
  changed_when: false
  check_mode: no

- name: 输出卸载结果
  debug:
    msg:
      - "卸载计划: {{ gpuenv_uninstall_selected | join(', ') }}"
      - >-
        {{ '指定组件卸载完成，无相关残留包' if (uninstall_verify.stdout | default('') | trim | length == 0)
           else '卸载完成，系统中仍存在以下相关包（可能不在本次卸载范围内）: ' + uninstall_verify.stdout }}
