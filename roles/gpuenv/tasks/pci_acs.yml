---
# PCIe ACS 关闭：GPUDirect RDMA / 多机 NCCL 测试要求关闭 PCI Switch 的 ACS（基线：关闭）
# 启用方式：gpuenv_install_pci_acs=true（配置型组件，无安装模式/离线包之分）
# 原理：setpci 将各设备 ACS 控制寄存器（ACSCtl）清零；该寄存器位于 PCI 配置空间，
#       重启后恢复固件默认值，因此必须通过 systemd 开机服务持久化
# 验证：lspci -vvv | grep ACSCtl 输出不应出现 "SrcValid+"
# 说明：脚本对全部支持 ACS 的设备无条件幂等执行（写 0000），
#       不再依赖"检测到启用才处理"分支——该分支会在"上次已 setpci 关闭、尚未重启"
#       （寄存器仍为关闭态）时误判为无需处理，导致开机服务未落盘，重启后 ACS 失效

- name: 安装 setpci 工具（pciutils）
  apt:
    name: pciutils
    state: present
  tags: [gpuenv, pci_acs]

- name: 写入 ACS 关闭脚本
  copy:
    dest: /usr/local/sbin/disable-pcie-acs.sh
    mode: '0755'
    content: |
      #!/usr/bin/env bash
      # 关闭所有支持 ACS 的 PCI 设备的 ACS 功能（GPUDirect RDMA / 多机 NCCL 要求）
      # 幂等执行：每台设备输出 "BDF ACSCtl 前值 -> 后值" 供审计；个别设备失败不中断
      set -u

      LSPCI=/usr/bin/lspci
      SETPCI=/usr/bin/setpci

      for BDF in $(${LSPCI} -D | awk '{print $1}'); do
        if ${SETPCI} -s "${BDF}" ECAP_ACS+0x6.w >/dev/null 2>&1; then
          BEFORE=$(${SETPCI} -s "${BDF}" ECAP_ACS+0x6.w 2>/dev/null || echo "unknown")

          ${SETPCI} -s "${BDF}" ECAP_ACS+0x6.w=0000 >/dev/null 2>&1 || true

          AFTER=$(${SETPCI} -s "${BDF}" ECAP_ACS+0x6.w 2>/dev/null || echo "unknown")

          echo "${BDF} ACSCtl ${BEFORE} -> ${AFTER}"
        fi
      done

      exit 0
  tags: [gpuenv, pci_acs]

- name: 立即执行 ACS 关闭（setpci 写寄存器，幂等）
  shell: /usr/local/sbin/disable-pcie-acs.sh
  register: acs_disable
  changed_when: true
  tags: [gpuenv, pci_acs]

- name: 显示 ACS 关闭明细（每台设备 前值 -> 后值）
  debug:
    msg: "{{ acs_disable.stdout_lines if acs_disable.stdout_lines else ['未发现支持 ACS 的设备'] }}"
  tags: [gpuenv, pci_acs]

- name: 配置开机自动关闭 ACS（systemd 服务，先于网络栈执行）
  copy:
    dest: /etc/systemd/system/disable-pcie-acs.service
    mode: '0644'
    content: |
      [Unit]
      Description=Disable PCIe ACS for GPUDirect RDMA
      DefaultDependencies=no
      After=local-fs.target
      Before=network-pre.target

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/disable-pcie-acs.sh
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target
  tags: [gpuenv, pci_acs]

- name: 启用开机自动关闭 ACS 服务
  systemd:
    name: disable-pcie-acs
    enabled: yes
    daemon_reload: yes
  tags: [gpuenv, pci_acs]

- name: 验证 ACS 已全部关闭（不应残留 SrcValid+）
  shell: |
    if lspci -vvv 2>/dev/null | grep ACSCtl | grep -q "SrcValid+"; then
      echo "failed"
    else
      echo "ok"
    fi
  register: acs_verify
  changed_when: false
  tags: [gpuenv, pci_acs]

- name: ACS 未完全关闭时报错
  fail:
    msg: >-
      仍检测到 SrcValid+（ACS 未完全关闭），请手动检查，
      定位命令：lspci -vvv | grep ACSCtl
  when: acs_verify.stdout | trim != 'ok'
  tags: [gpuenv, pci_acs]
