---
# 解除 GPU 相关包的 apt hold 标记（组件安装/重装/升级前执行）
# 为什么需要：apt 非交互模式（-y）会拒绝变更被 hold 的包
#   （报错 "Held packages were changed and -y was used..."），
#   因此在任何安装/升级/卸载动作之前，必须先解除本 playbook 管理范围内的 hold
# 与 uninstall role 的卸载前解 hold 逻辑保持一致（按包名前缀匹配，覆盖全部英伟达生态包）
# 幂等：无 hold 时输出提示并跳过

- name: 解除 GPU 相关包的 hold 标记（幂等）
  shell: |
    held=$(apt-mark showhold 2>/dev/null | grep -E '^(nvidia-|libnvidia-|cuda|xserver-xorg-video-nvidia|libnccl|datacenter-gpu-manager)' || true)
    if [ -n "$held" ]; then
      apt-mark unhold $held
    else
      echo "无 GPU 相关包被 hold，跳过"
    fi
  register: gpuenv_unhold_release
  changed_when: "'Canceled hold' in gpuenv_unhold_release.stdout"
  failed_when: false
  tags: [gpuenv, apt_hold, driver, cuda, fabricmanager, nccl]
