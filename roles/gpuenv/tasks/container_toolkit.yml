---
# 可选组件：nvidia-container-toolkit（容器内使用 GPU）
# 启用方式：-e gpuenv_install_container_toolkit=true
# 安装模式（gpuenv_container_toolkit_install_mode）：
#   - online（默认）：在线 apt 安装（NVIDIA 官方源）
#   - package：使用本地 deb 安装包（-e gpuenv_container_toolkit_package=<deb 包路径或 URL>）

#=============================== online 在线模式 ================================
- name: 安装 nvidia-container-toolkit（online 模式）
  apt:
    name: nvidia-container-toolkit
    state: present
  when: gpuenv_container_toolkit_install_mode == 'online'
  tags: [gpuenv, container_toolkit]

#=============================== package 离线模式 ================================
- name: package 模式校验安装包参数
  fail:
    msg: >-
      gpuenv_container_toolkit_install_mode=package 但未提供安装包，请通过
      -e gpuenv_container_toolkit_package=<nvidia-container-toolkit deb 包路径或 URL> 指定
  when:
    - gpuenv_container_toolkit_install_mode == 'package'
    - gpuenv_container_toolkit_package | length == 0
  tags: [gpuenv, container_toolkit]

- name: 下载 container-toolkit deb 包（URL）
  get_url:
    url: "{{ gpuenv_container_toolkit_package }}"
    dest: "{{ gpuenv_pkg_dir }}/nvidia-container-toolkit.deb"
    mode: '0644'
  when:
    - gpuenv_container_toolkit_install_mode == 'package'
    - gpuenv_container_toolkit_package is match('^https?://')
  tags: [gpuenv, container_toolkit]

- name: 拷贝本地 container-toolkit deb 包到安装包目录
  copy:
    src: "{{ gpuenv_container_toolkit_package }}"
    dest: "{{ gpuenv_pkg_dir }}/nvidia-container-toolkit.deb"
    mode: '0644'
  when:
    - gpuenv_container_toolkit_install_mode == 'package'
    - gpuenv_container_toolkit_package is not match('^https?://')
  tags: [gpuenv, container_toolkit]

- name: 安装 container-toolkit（package 模式，本地 deb 包）
  apt:
    deb: "{{ gpuenv_pkg_dir }}/nvidia-container-toolkit.deb"
  when: gpuenv_container_toolkit_install_mode == 'package'
  tags: [gpuenv, container_toolkit]

# 注意：安装完成后保留 {{ gpuenv_pkg_dir }}/nvidia-container-toolkit.deb 安装包，不做删除

#=============================== 公共：docker 运行时配置 ===========================
- name: 检查 docker 是否已安装
  command: docker --version
  register: docker_check
  changed_when: false
  failed_when: false
  tags: [gpuenv, container_toolkit]

- name: 配置 docker 使用 nvidia 运行时
  command: nvidia-ctk runtime configure --runtime=docker
  register: nvidia_ctk_configure
  changed_when: "'Successfully configured' in nvidia_ctk_configure.stdout or 'configured' in nvidia_ctk_configure.stdout"
  when: docker_check.rc == 0
  tags: [gpuenv, container_toolkit]

- name: 重启 docker 使 nvidia 运行时生效
  systemd:
    name: docker
    state: restarted
  when: docker_check.rc == 0 and nvidia_ctk_configure is changed
  tags: [gpuenv, container_toolkit]

- name: 容器支持配置结果提示
  debug:
    msg: >-
      {{ 'nvidia-container-toolkit 已安装并配置 docker 运行时（docker run --gpus all 可用）' if docker_check.rc == 0 else
         'nvidia-container-toolkit 已安装（未检测到 docker，跳过运行时配置）' }}
  tags: [gpuenv, container_toolkit]
