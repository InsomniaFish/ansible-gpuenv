---
# 步骤 5：安装 CUDA Toolkit（对应手册：仅安装 Toolkit 本体，不含驱动）
# 安装模式（gpuenv_cuda_install_mode）：
#   - online（默认）：在线 apt 安装，支持两位版本（12.6）与三位版本（12.6.2 精确锁定）
#   - package：使用官方 run 安装包（gpuenv_cuda_package），以 --silent --toolkit
#     方式仅安装 Toolkit（不装驱动，等效文档"取消勾选 Driver"），适用于离线场景

- name: 设置 CUDA 包名（取主.次版本，如 cuda-toolkit-12-6）
  set_fact:
    gpuenv_cuda_pkg: "cuda-toolkit-{{ gpuenv_cuda_version.split('.')[:2] | join('-') }}"
    gpuenv_cuda_series: "{{ gpuenv_cuda_version.split('.')[:2] | join('.') }}"
  tags: [gpuenv, cuda]

#=============================== online 在线模式 ================================
- name: 检查 CUDA Toolkit 是否已安装（仅完全安装状态 ii 视为已安装）
  shell: |
    status=$(dpkg-query -W -f='${db:Status-Abbrev}' {{ gpuenv_cuda_pkg }} 2>/dev/null | cut -c1-2)
    [ "$status" = "ii" ] && dpkg-query -W -f='${Version}' {{ gpuenv_cuda_pkg }}
  register: cuda_installed
  changed_when: false
  failed_when: false
  when: gpuenv_cuda_install_mode == 'online'
  tags: [gpuenv, cuda]

- name: 设置已安装 CUDA 版本事实（online 模式）
  set_fact:
    gpuenv_cuda_installed_ver: "{{ cuda_installed.stdout | trim }}"
  when: gpuenv_cuda_install_mode == 'online'
  tags: [gpuenv, cuda]

- name: 校验源中存在目标 CUDA 包
  shell: apt-cache show {{ gpuenv_cuda_pkg }}
  register: cuda_pkg_check
  changed_when: false
  failed_when: false
  when: gpuenv_cuda_install_mode == 'online'
  tags: [gpuenv, cuda]

- name: CUDA 包不存在时报错
  fail:
    msg: "源中未找到 {{ gpuenv_cuda_pkg }}，请检查 gpuenv_cuda_version 变量"
  when:
    - gpuenv_cuda_install_mode == 'online'
    - cuda_pkg_check.rc != 0
  tags: [gpuenv, cuda]

- name: 查找源中与目标版本匹配的完整版本号
  shell: >
    apt-cache madison {{ gpuenv_cuda_pkg }}
    | awk -F'|' '{gsub(/ /,"",$2); print $2}'
    | grep -F "{{ gpuenv_cuda_version }}" | head -n 1
  register: cuda_repo_ver
  changed_when: false
  when: gpuenv_cuda_install_mode == 'online'
  tags: [gpuenv, cuda]

- name: CUDA 版本不存在时报错
  fail:
    msg: "源中未找到 {{ gpuenv_cuda_pkg }} 版本 {{ gpuenv_cuda_version }}，请检查版本配置"
  when:
    - gpuenv_cuda_install_mode == 'online'
    - cuda_repo_ver.stdout | trim | length == 0
  tags: [gpuenv, cuda]

- name: 安装 CUDA Toolkit（online 模式，锁定目标版本）
  apt:
    name: "{{ gpuenv_cuda_pkg }}={{ cuda_repo_ver.stdout | trim }}"
    state: present
  when:
    - gpuenv_cuda_install_mode == 'online'
    - >
      gpuenv_force
      or gpuenv_cuda_installed_ver == ''
      or gpuenv_cuda_version not in gpuenv_cuda_installed_ver
  tags: [gpuenv, cuda]

- name: CUDA 已安装且版本一致，跳过（online 模式）
  debug:
    msg: "{{ gpuenv_cuda_pkg }} 已安装 {{ gpuenv_cuda_installed_ver }}，与目标版本一致，跳过"
  when:
    - gpuenv_cuda_install_mode == 'online'
    - not gpuenv_force
    - gpuenv_cuda_installed_ver != ''
    - gpuenv_cuda_version in gpuenv_cuda_installed_ver
  tags: [gpuenv, cuda]

#=============================== package 离线模式 ================================
# 使用官方 run 安装包，--silent --toolkit 仅安装 Toolkit（不装驱动）

- name: package 模式校验安装包参数
  fail:
    msg: >-
      gpuenv_cuda_install_mode=package 但未提供安装包，请通过
      -e gpuenv_cuda_package=<cuda_xxx_linux.run 路径或 URL> 指定
  when:
    - gpuenv_cuda_install_mode == 'package'
    - gpuenv_cuda_package | length == 0
  tags: [gpuenv, cuda]

- name: 检查 CUDA Toolkit 是否已安装（run 方式，读取 version.json）
  shell: |
    vf="/usr/local/cuda-{{ gpuenv_cuda_series }}/version.json"
    if [ -f "$vf" ]; then
      python3 -c "import json;print(json.load(open('$vf'))['cuda']['version'])" 2>/dev/null
    fi
  register: cuda_run_installed
  changed_when: false
  failed_when: false
  check_mode: no
  when: gpuenv_cuda_install_mode == 'package'
  tags: [gpuenv, cuda]

- name: 设置已安装 CUDA 版本事实（package 模式）
  set_fact:
    gpuenv_cuda_installed_ver: "{{ cuda_run_installed.stdout | trim }}"
  when: gpuenv_cuda_install_mode == 'package'
  tags: [gpuenv, cuda]

- name: CUDA 已安装且版本一致，跳过（package 模式）
  debug:
    msg: "CUDA Toolkit 已安装 {{ gpuenv_cuda_installed_ver }}，与目标版本一致，跳过"
  when:
    - gpuenv_cuda_install_mode == 'package'
    - not gpuenv_force
    - gpuenv_cuda_installed_ver != ''
    - gpuenv_cuda_version in gpuenv_cuda_installed_ver
  tags: [gpuenv, cuda]

- name: 下载 CUDA run 安装包（URL）
  get_url:
    url: "{{ gpuenv_cuda_package }}"
    dest: "{{ gpuenv_pkg_dir }}/cuda_installer.run"
    mode: '0755'
  when:
    - gpuenv_cuda_install_mode == 'package'
    - >
      gpuenv_force
      or gpuenv_cuda_installed_ver == ''
      or gpuenv_cuda_version not in gpuenv_cuda_installed_ver
    - gpuenv_cuda_package is match('^https?://')
  tags: [gpuenv, cuda]

- name: 拷贝本地 CUDA run 安装包到安装包目录
  copy:
    src: "{{ gpuenv_cuda_package }}"
    dest: "{{ gpuenv_pkg_dir }}/cuda_installer.run"
    mode: '0755'
  when:
    - gpuenv_cuda_install_mode == 'package'
    - >
      gpuenv_force
      or gpuenv_cuda_installed_ver == ''
      or gpuenv_cuda_version not in gpuenv_cuda_installed_ver
    - gpuenv_cuda_package is not match('^https?://')
  tags: [gpuenv, cuda]

- name: 执行 CUDA run 安装（仅 Toolkit，不含驱动，耗时较长）
  command: >
    {{ gpuenv_pkg_dir }}/cuda_installer.run --silent --toolkit
    --toolkitpath=/usr/local/cuda-{{ gpuenv_cuda_series }}
    --override
  register: cuda_run_install
  when:
    - gpuenv_cuda_install_mode == 'package'
    - >
      gpuenv_force
      or gpuenv_cuda_installed_ver == ''
      or gpuenv_cuda_version not in gpuenv_cuda_installed_ver
  tags: [gpuenv, cuda]

# 注意：安装完成后保留 {{ gpuenv_pkg_dir }}/cuda_installer.run 安装包，不做删除

- name: 验证 CUDA run 安装结果
  shell: |
    vf="/usr/local/cuda-{{ gpuenv_cuda_series }}/version.json"
    [ -f "$vf" ] && python3 -c "import json;print(json.load(open('$vf'))['cuda']['version'])"
  register: cuda_run_verify
  changed_when: false
  failed_when: false
  check_mode: no
  when:
    - gpuenv_cuda_install_mode == 'package'
    - >
      gpuenv_force
      or gpuenv_cuda_installed_ver == ''
      or gpuenv_cuda_version not in gpuenv_cuda_installed_ver
  tags: [gpuenv, cuda]

- name: CUDA run 安装失败时报错
  fail:
    msg: "CUDA run 安装失败，请检查安装日志（/var/log/cuda-installer.log）"
  when:
    - gpuenv_cuda_install_mode == 'package'
    - >
      gpuenv_force
      or gpuenv_cuda_installed_ver == ''
      or gpuenv_cuda_version not in gpuenv_cuda_installed_ver
    - cuda_run_verify.stdout | trim | length == 0
  tags: [gpuenv, cuda]

#=============================== 公共：环境变量 ===================================
- name: 配置 CUDA 环境变量
  template:
    src: cuda.sh.j2
    dest: "{{ gpuenv_cuda_profile }}"
    mode: '0644'
  tags: [gpuenv, cuda]

- name: 验证 nvcc 可用
  command: /usr/local/cuda/bin/nvcc -V
  register: nvcc_check
  changed_when: false
  tags: [gpuenv, cuda]

- name: 显示 nvcc 版本
  debug:
    msg: "{{ nvcc_check.stdout_lines[-2:] }}"
  tags: [gpuenv, cuda]
