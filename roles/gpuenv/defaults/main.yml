---
#===============================================================================
# GPUENV role 默认变量
# 设计原则：
#   1. 默认不安装任何组件：所有 gpuenv_install_* 开关默认 false，
#      由用户在 vars/deploy.yml 配置清单或 -e 参数中显式指定要安装的组件
#   2. 每个组件对应独立的任务 yaml，且均支持两种安装模式：
#      gpuenv_<组件>_install_mode = online（在线）| package（离线本地包）
#   3. 软件源 URL 与组件版本独立维护在 vars/gpuenv_repos.yml
#      （由 site.yml 通过 vars_files 加载），命令行 -e 可临时覆盖
#===============================================================================

# --- 组件安装开关（默认全部 false，由用户自行指定） ---
gpuenv_install_ofed: false              # MLNX OFED / RDMA 栈（必须在 GPU 驱动之前安装）
gpuenv_install_driver: false            # NVIDIA GPU 驱动
gpuenv_install_peermem: false           # nvidia_peermem（GPUDirect RDMA，依赖驱动）
gpuenv_install_pci_acs: false           # 关闭 PCI ACS（多机通信要求）
gpuenv_install_cuda: false              # CUDA Toolkit
gpuenv_install_fabricmanager: false     # nvidia-fabricmanager（版本须与驱动完全一致）
gpuenv_install_gpu_burn: false          # gpu-burn（GPU 压力测试）
gpuenv_install_nccl: false              # NCCL 库 + OpenMPI + nccl-tests
gpuenv_install_dcgm: false              # DCGM 数据中心 GPU 管理器（硬件诊断/监控）
gpuenv_install_container_toolkit: false # nvidia-container-toolkit（容器内使用 GPU）

# --- 行为开关 ---
gpuenv_nccl_tests_ssh_trust: true        # nccl-tests 多机测试前置：配置主机间 SSH 免密互信（置 false 跳过）
gpuenv_force: false                   # 是否忽略已安装检测，强制重装
gpuenv_reboot_after_driver: false     # 驱动安装后是否自动重启（生产验收建议开启）
gpuenv_apt_hold: true                 # 安装完成后 apt-mark hold 驱动/CUDA/fabricmanager/NCCL 等包，
                                      # 防止 apt upgrade 意外升级（重装/升级版本/卸载前自动解除）

# --- 安装模式（每个组件均支持 online 在线 / package 离线） ---
# online ：在线安装（apt 官方源 / 官方直链下载）
# package：离线安装（使用本地安装包，通过对应 gpuenv_<组件>_package 指定本地路径或 URL）
gpuenv_driver_install_mode: "online"
gpuenv_cuda_install_mode: "online"
gpuenv_fm_install_mode: "online"
gpuenv_ofed_install_mode: "online"
gpuenv_nccl_install_mode: "online"
gpuenv_gpu_burn_install_mode: "online"
gpuenv_dcgm_install_mode: "online"
gpuenv_container_toolkit_install_mode: "online"

# --- 离线安装包（仅 package 模式使用；本地路径或 URL） ---
# 驱动 .run 安装包，官方归档：
#   https://download.nvidia.com/XFree86/Linux-x86_64/<版本>/NVIDIA-Linux-x86_64-<版本>.run
gpuenv_driver_package: ""
# CUDA run 安装包，官方归档页：https://developer.nvidia.com/cuda-toolkit-archive
# 默认官方直链（12.6.2，捆绑驱动 560.35.03；其他版本需按归档页调整）
gpuenv_cuda_package: "https://developer.download.nvidia.cn/compute/cuda/13.0.2/local_installers/cuda_13.0.2_580.95.05_linux.run"
# fabricmanager deb 安装包（源中无对应版本时使用），例如：
#   https://developer.download.nvidia.cn/compute/cuda/repos/ubuntu2204/x86_64/nvidia-fabricmanager_<版本>-1_amd64.deb
gpuenv_fm_package: ""
# OFED tgz 安装包，默认官方直链（24.10-1.1.4.0，与基线一致），其他版本按规则拼接：
#   https://content.mellanox.com/ofed/MLNX_OFED-<版本>/MLNX_OFED_LINUX-<版本>-ubuntu22.04-x86_64.tgz
gpuenv_ofed_package: "https://content.mellanox.com/ofed/MLNX_OFED-24.10-1.1.4.0/MLNX_OFED_LINUX-24.10-1.1.4.0-ubuntu22.04-x86_64.tgz"
# NCCL 离线安装包：存放 libnccl2 / libnccl-dev deb 包的本地目录
gpuenv_nccl_package: ""
# OpenMPI 源码包（离线）：本地 openmpi-x.y.z.tar.gz 路径
gpuenv_openmpi_src_package: ""
# nccl-tests 源码包（离线）：本地 nccl-tests zip 包路径
gpuenv_nccl_tests_src_package: ""
# gpu-burn 源码包（离线）：本地 gpu-burn zip 包路径
gpuenv_gpu_burn_package: ""
# DCGM deb 安装包（离线）：本地 datacenter-gpu-manager deb 路径或 URL
gpuenv_dcgm_package: ""
# nvidia-container-toolkit deb 安装包（离线）：本地路径或 URL
gpuenv_container_toolkit_package: ""

# --- 源与版本兜底默认值（正常情况下由 vars/gpuenv_repos.yml 提供） ---
gpuenv_repo_base_url: "https://developer.download.nvidia.cn/compute/cuda/repos/ubuntu2204/x86_64"
gpuenv_keyring_deb: "cuda-keyring_1.1-1_all.deb"
gpuenv_gpu_burn_url: "https://ghproxy.net/https://github.com/wilicc/gpu-burn/archive/refs/heads/master.zip"
gpuenv_driver_version: "580.105.08"
gpuenv_cuda_version: "13.0.2"
gpuenv_fm_version: ""                 # 留空则与驱动版本一致
gpuenv_nccl_version: "2.28.9"
gpuenv_nccl_tests_url: "https://ghproxy.net/https://github.com/NVIDIA/nccl-tests/archive/refs/heads/master.zip"
gpuenv_openmpi_version: "4.1.7"
gpuenv_openmpi_url: "https://mirrors.huaweicloud.com/openmpi/openmpi-4.1.7.tar.gz"

# --- MLNX OFED（官方下载页见下） ---
# 官方下载：https://network.nvidia.com/products/infiniband-drivers/linux/mlnx_ofed/
# 说明：NVIDIA 官方 OFED apt 仓库（linux.mellanox.com）实测无法通过 apt 拉取，
#       故 online 模式安装 Ubuntu 原生 RDMA 栈（rdma-core 等，内核自带 mlx5 驱动）
gpuenv_ofed_version: "24.10-3.2.0"
# online 模式安装的 RDMA 软件包（可按需增减）
gpuenv_ofed_native_packages:
  - rdma-core
  - ibverbs-providers
  - ibverbs-utils
  - infiniband-diags
  - perftest
  - libibverbs-dev
  - librdmacm-dev

# --- 路径配置 ---
# 项目基准目录（控制节点上本项目的目录；远程节点部署时会自动创建）
gpuenv_base_dir: "/root/ansible-gpuenv"
# 安装包存放目录（统一在 /opt 下，持久保留；/tmp 会被系统定期清理，不用于存放安装包）
gpuenv_pkg_dir: "/opt/packages"
# 构建目录（源码解压与编译统一在 /opt/build 下）
gpuenv_build_dir: "/opt/build"
# gpu-burn 源码与编译目录（位于构建目录下）
gpuenv_gpu_burn_dir: "/opt/build/gpu-burn"
# nccl-tests 源码与编译目录（位于构建目录下）
gpuenv_nccl_tests_dir: "/opt/build/nccl-tests"
# OpenMPI 源码目录（位于构建目录下；安装位置仍为 /usr/local/openmpi）
gpuenv_openmpi_src_dir: "/opt/build/openmpi-{{ gpuenv_openmpi_version }}"
# CUDA 环境变量文件（系统固定位置，必须为绝对路径）
gpuenv_cuda_profile: "/etc/profile.d/cuda.sh"

# --- 驱动主系列号（由驱动版本自动推导，无需修改） ---
gpuenv_driver_major: "{{ gpuenv_driver_version.split('.')[0] }}"

# --- 驱动子包列表（指定版本时需全部锁定，避免依赖冲突） ---
# 注意：
#   - 580+ 系列新增 libnvidia-common / libnvidia-gpucomp / nvidia-firmware 子包，必须一并锁定
#   - 580+ 系列中 nvidia-utils / nvidia-compute-utils 已并入 libnvidia-compute，
#     同版本安装会触发 Conflicts，故不纳入锁定列表（旧系列由驱动元包精确依赖自动拉取）
gpuenv_driver_subpackages:
  - nvidia-driver
  - nvidia-dkms
  - nvidia-kernel-common
  - nvidia-kernel-source
  - libnvidia-compute
  - libnvidia-extra
  - libnvidia-gl
  - libnvidia-decode
  - libnvidia-encode
  - libnvidia-fbc1
  - libnvidia-cfg1
  - libnvidia-common
  - libnvidia-gpucomp
  - nvidia-firmware
  - xserver-xorg-video-nvidia
