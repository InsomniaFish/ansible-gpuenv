---
#===============================================================================
# 部署配置清单（deploy.yml）
#
# 作用：把"装哪些组件、版本多少、在线还是离线、离线包在哪"集中写在本文件，
#       执行时无需再拼一长串 -e 参数：
#         ansible-playbook -i inventory.ini site.yml
#
# 变量优先级（从低到高）：
#   role defaults < vars/gpuenv_repos.yml < vars/deploy.yml < -e 命令行
#   即：本文件可覆盖版本基线；命令行 -e 仍可临时覆盖本文件。
#
# 每个组件块按固定顺序配置：
#   ① 是否安装  gpuenv_install_<组件>
#   ② 版本      gpuenv_<组件>_version（无版本概念的组件省略此行）
#   ③ 安装方式  gpuenv_<组件>_install_mode：online=在线 / package=离线
#   ④ 离线包    gpuenv_<组件>_package（仅 package 方式生效；支持本地路径或 URL）
# 选在线：③ 填 online，④ 保持注释；选离线：③ 填 package，④ 取消注释并填写路径。
#===============================================================================

#===============================================================================
# MLNX OFED / RDMA 栈（须先于驱动安装）
#===============================================================================
gpuenv_install_ofed: true
gpuenv_ofed_version: "23.10-2.1.3.1"       # package 方式安装后校验用；online 方式装 rdma-core 与此无关
gpuenv_ofed_install_mode: package          # online=Ubuntu 原生 rdma-core / package=官方 MLNX_OFED tgz 安装器
gpuenv_ofed_package: /opt/packages/MLNX_OFED_LINUX-23.10-2.1.3.1-ubuntu22.04-x86_64.tgz
                                            # 离线 tgz（本地路径，与下行远程 URL 二选一）
#gpuenv_ofed_package: "https://content.mellanox.com/ofed/MLNX_OFED-23.10-2.1.3.1/MLNX_OFED_LINUX-23.10-2.1.3.1-ubuntu22.04-x86_64.tgz"

#===============================================================================
# NVIDIA GPU 驱动
#===============================================================================
gpuenv_install_driver: true
gpuenv_driver_version: "580.178.04"
gpuenv_driver_install_mode: online         # online=apt cuda 源 / package=离线 .run 包
#gpuenv_driver_package: /opt/packages/NVIDIA-Linux-x86_64-580.178.04.run

#===============================================================================
# CUDA Toolkit
#===============================================================================
gpuenv_install_cuda: true
gpuenv_cuda_version: "13.0.2"              # online 匹配 cuda-toolkit-13-0
gpuenv_cuda_install_mode: online           # online=apt cuda 源 / package=离线 .run 包
#gpuenv_cuda_package: /opt/packages/cuda_13.0.2_580.95.05_linux.run

#===============================================================================
# nvidia-fabricmanager（版本须与驱动完全一致）
#===============================================================================
gpuenv_install_fabricmanager: true
gpuenv_fm_version: "580.178.04"                      # 留空 = 与驱动版本一致（580.178.04）
gpuenv_fm_install_mode: online             # online=apt cuda 源 / package=离线 deb
#gpuenv_fm_package: /opt/packages/nvidia-fabricmanager_580.178.04-1ubuntu1_amd64.deb

#===============================================================================
# NCCL + OpenMPI + nccl-tests（gpuenv_install_nccl 一个开关控制三件套）
#===============================================================================
gpuenv_install_nccl: true
# —— NCCL 库 ——
gpuenv_nccl_version: "2.28.9"              # online 匹配源中 2.28.9-1+cuda13.0；离线 deb 获取页：
                                            # https://developer.nvidia.com/nccl/nccl-download
gpuenv_nccl_install_mode: online           # online=apt 源 / package=离线 deb 包目录
#gpuenv_nccl_package: /opt/packages/nccl-debs    # 存放 libnccl2/libnccl-dev deb 包的目录
# —— OpenMPI（源码编译；无 install_mode 变量：本地源码包路径留空 = 在线下载直链，填路径 = 离线）——
gpuenv_openmpi_version: "4.1.8"
gpuenv_openmpi_url: "https://download.open-mpi.org/release/open-mpi/v4.1/openmpi-4.1.8.tar.gz"
#gpuenv_openmpi_src_package: /opt/packages/openmpi-4.1.8.tar.gz    # 取消注释即优先于 url 使用本地包
# —— nccl-tests（源码编译；同样无 install_mode 变量：离线 zip 路径留空 = 在线下载）——
gpuenv_nccl_tests_src_package: /opt/packages/nccl-tests-src.zip    # 支持通配符（如 nccl-tests*.zip）；裸文件名按 /opt/packages 解析

#===============================================================================
# nvidia_peermem（GPUDirect RDMA；模块随驱动编译，仅做加载与开机自启，无在线/离线之分）
#===============================================================================
gpuenv_install_peermem: true

#===============================================================================
# 关闭 PCI ACS（多机通信要求；内置脚本，无安装包）
#===============================================================================
gpuenv_install_pci_acs: true

#===============================================================================
# gpu-burn GPU 压力测试（源码编译，跟随 master 分支无版本号）
#===============================================================================
#gpuenv_install_gpu_burn: true
#gpuenv_gpu_burn_install_mode: online      # online=GitHub 直链 / package=离线 zip
#gpuenv_gpu_burn_package: /opt/packages/gpu-burn-src.zip    # 内含 gpu-burn-master

#===============================================================================
# DCGM 诊断监控
#===============================================================================
#gpuenv_install_dcgm: true
#gpuenv_dcgm_install_mode: online          # online=apt 源 / package=离线 deb
#gpuenv_dcgm_package: /opt/packages/datacenter-gpu-manager_<版本>_amd64.deb

#===============================================================================
# nvidia-container-toolkit（容器内使用 GPU；安装过程会重启 docker）
#===============================================================================
#gpuenv_install_container_toolkit: true
#gpuenv_container_toolkit_install_mode: online    # online=apt 源 / package=离线 deb
#gpuenv_container_toolkit_package: /opt/packages/nvidia-container-toolkit_<版本>-1_amd64.deb

#===============================================================================
# 行为开关
#===============================================================================
# gpuenv_force: false                      # 忽略已安装检测，强制重装
gpuenv_reboot_after_driver: false          # 驱动安装后自动重启（加载内核模块），关闭后需手动重启
# gpuenv_apt_hold: true                    # 安装后 apt-mark hold 驱动/CUDA/fabricmanager/NCCL 的包，
                                            # 防止 apt upgrade 意外升级版本联动组件（默认开启；
                                            # 重装/升级版本/卸载前自动解除，设 false 关闭此保护）

#===============================================================================
# 卸载配置（供 uninstall.yml 读取）
#===============================================================================
# gpuenv_uninstall_components: core        # 卸载范围，取值如下：
#   core（默认）: driver,cuda,fabricmanager,gpu_burn
#   all         : core + nccl,openmpi,nccl_tests,dcgm,container_toolkit,ofed,peermem,pci_acs
#   逗号分隔列表: 仅卸载指定组件（可任意组合），例如：
#     gpuenv_uninstall_components: nccl,dcgm
#     gpuenv_uninstall_components: driver,cuda,fabricmanager
#     gpuenv_uninstall_components: openmpi,nccl_tests
# 可用组件名：
#   核心:  driver cuda fabricmanager gpu_burn
#   可选:  nccl openmpi nccl_tests dcgm container_toolkit ofed peermem pci_acs
# 另可通过 -e gpuenv_uninstall_components=<值> 临时覆盖
gpuenv_uninstall_autoremove: true          # 卸载后执行 autoremove 清理孤立依赖（设 false 跳过，
                                            # 或 -e gpuenv_uninstall_autoremove=false 临时覆盖）
