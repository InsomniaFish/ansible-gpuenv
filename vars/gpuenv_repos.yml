---
#===============================================================================
# 软件源与版本配置（独立维护，便于指定/切换版本）
# 由 site.yml 通过 vars_files 加载，优先级高于 role defaults，
# 命令行 -e 参数可临时覆盖本文件中的值。
#
# 组件选择与安装模式：
#   - 默认不安装任何组件，需通过 -e gpuenv_install_<组件>=true 显式指定
#   - 每个组件均支持两种模式：-e gpuenv_<组件>_install_mode=online|package
#       online ：在线安装（apt 官方源 / 官方直链下载）
#       package：离线安装（通过 -e gpuenv_<组件>_package=<本地包路径> 指定安装包）
#===============================================================================

# --- 源 URL 配置 ---
# NVIDIA CUDA 官方软件源基础地址（驱动 / CUDA / fabricmanager / NCCL / DCGM 均来自该源）
#   - 国内加速：域名可改为 developer.download.nvidia.cn
#   - 其他系统：ubuntu2204 可改为 ubuntu2004 / ubuntu2404 等
gpuenv_repo_base_url: "https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2204/x86_64"

# cuda-keyring 软件源密钥包文件名（与 gpuenv_repo_base_url 拼接为完整下载地址）
gpuenv_keyring_deb: "cuda-keyring_1.1-1_all.deb"

# gpu-burn 源码下载地址（online 模式）
#   - 指定版本：将 master 改为对应 tag，例如
#     https://github.com/wilicc/gpu-burn/archive/refs/tags/v1.1.zip
gpuenv_gpu_burn_url: "https://github.com/wilicc/gpu-burn/archive/refs/heads/master.zip"

# --- 版本配置（默认以 base_vesion.md 版本基线为准） ---
gpuenv_driver_version: "560.35.05"    # NVIDIA 驱动版本（基线：560.35.05，560.35.03 也可）
gpuenv_cuda_version: "12.6.2"         # CUDA Toolkit 版本（基线：12.6，建议 12.6.2）
gpuenv_fm_version: ""                 # fabricmanager 版本，留空则与驱动一致
gpuenv_nccl_version: "2.23.4"         # NCCL 版本（基线：2.23.4，需与 CUDA 版本配套）

# --- CUDA 离线安装包（仅 package 模式） ---
# 本地路径或 URL，默认官方直链
# 注意：run 包文件名中的驱动版本（560.35.03）与 gpuenv_driver_version 可能不同，
# 其他 CUDA 版本需按官方归档页调整：https://developer.nvidia.com/cuda-toolkit-archive
gpuenv_cuda_package: "https://developer.download.nvidia.com/compute/cuda/12.6.2/local_installers/cuda_12.6.2_560.35.03_linux.run"

# --- 可选组件源配置 ---
# nccl-tests 源码下载地址（online 模式，多卡带宽测试）
#   - 指定版本：将 master 改为对应 tag，例如 refs/tags/v2.13.1.zip
gpuenv_nccl_tests_url: "https://github.com/NVIDIA/nccl-tests/archive/refs/heads/master.zip"

# OpenMPI 源码下载地址（基线：4.1.5，需源码编译安装）
gpuenv_openmpi_version: "4.1.5"
gpuenv_openmpi_url: "https://download.open-mpi.org/release/open-mpi/v4.1/openmpi-4.1.5.tar.gz"

# --- IB 网络（基线见 base_vesion.md：MLNX OFED 24.10-1.1.4.0，需先于 GPU 驱动安装） ---
# OFED 安装包（本地路径或 URL）：
#   - 默认已配置官方直链（24.10-1.1.4.0，与基线一致），package 模式开箱即用
#   - 其他版本按规则拼接：https://content.mellanox.com/ofed/MLNX_OFED-<版本>/MLNX_OFED_LINUX-<版本>-ubuntu22.04-x86_64.tgz
#   - 注意：下载路径的版本号不带 -LTS 后缀
# 官方下载页：https://network.nvidia.com/products/infiniband-drivers/linux/mlnx_ofed/
gpuenv_ofed_version: "24.10-1.1.4.0"
gpuenv_ofed_package: "https://content.mellanox.com/ofed/MLNX_OFED-24.10-1.1.4.0/MLNX_OFED_LINUX-24.10-1.1.4.0-ubuntu22.04-x86_64.tgz"
